services:
  app:
    image: mcr.microsoft.com/devcontainers/go:1.26
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      TOPOLOGY_DATABASE_URL: postgres://topology:topology@postgres:5432/topology?sslmode=disable
      TOPOLOGY_APP_ENV: development
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: topology
      POSTGRES_PASSWORD: topology
      POSTGRES_DB: topology
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

services:
  app:
    image: mcr.microsoft.com/devcontainers/go:1.26
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      TOPOLOGY_DATABASE_URL: postgres://topology:topology@postgres:5432/topology?sslmode=disable
      TOPOLOGY_S3_ENDPOINT: http://minio:9000
      TOPOLOGY_S3_BUCKET: topology-backups
      TOPOLOGY_S3_ACCESS_KEY: minioadmin
      TOPOLOGY_S3_SECRET_KEY: minioadmin
      TOPOLOGY_APP_ENV: development
    depends_on:
      - postgres
      - minio

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: topology
      POSTGRES_PASSWORD: topology
      POSTGRES_DB: topology
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:

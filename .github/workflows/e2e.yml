name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright (full stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Builds the app image and starts Postgres + MinIO + app. The app
      # auto-runs migrations and serves the embedded SPA on :8080 in dev mode
      # (so the dev-login the specs rely on is available).
      - name: Start the stack
        run: docker compose up -d --build

      - name: Seed a minimal dataset
        run: ./.github/scripts/seed.sh

      - name: Run e2e tests
        working-directory: frontend
        run: npx playwright test
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://localhost:8080

      - name: App logs on failure
        if: failure()
        run: docker compose logs app --tail=200

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose down -v

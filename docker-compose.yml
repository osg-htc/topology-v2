# One-command local stack: Postgres + the topology webapp (built from the
# Dockerfile with the frontend embedded). Everything the app needs.
#
#   docker compose up --build
#   open http://localhost:8080   (dev mode: use the "Dev login" box)
#
# Data persists in named volumes across restarts; the fixed dev INSTANCE_KEY
# below keeps encrypted columns readable between runs. Do NOT use these
# credentials or key outside local development.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: topology
      POSTGRES_PASSWORD: topology
      POSTGRES_DB: topology
    ports:
      # Host ports are deliberately non-default to avoid clashing with other
      # local stacks (the app reaches these over the internal network, so these
      # mappings are only for optional external access). Override in a
      # docker-compose.override.yml if you like.
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topology"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      args:
        VERSION: dev-compose
    ports:
      - "8080:8080"
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TOPOLOGY_APP_ENV: development
      TOPOLOGY_DATABASE_URL: postgres://topology:topology@postgres:5432/topology?sslmode=disable
      TOPOLOGY_BASE_URL: http://localhost:8080
      # Fixed 32-byte (64 hex) key so encrypted data survives restarts. DEV ONLY.
      TOPOLOGY_INSTANCE_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
      # Optional: which GitHub repo the admin "Import from GitHub" pulls.
      TOPOLOGY_GITHUB_REPO: opensciencegrid/topology

volumes:
  pgdata:
